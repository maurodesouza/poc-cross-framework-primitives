# CI for the POC.
#
#   Checks   Biome, the source layout check, TypeScript, the unit tests and the build.
#   E2E      the Playwright conformance suite (conformance/), one parallel job per registered
#            implementation (conformance/src/implementations.ts; the matrix must list them all,
#            checked by tests/ci-workflow.test.ts), in Playwright's image
#            (mcr.microsoft.com/playwright, the tag of the pinned @playwright/test, checked by
#            tests/ci-workflow.test.ts: no browser install). The suite builds and serves each
#            fixture itself (playwright.config.ts webServer), so each job builds only its own.
#
# Tests run on pull requests and on a manual run; a push to main runs nothing (main is what its PR
# tested).

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [baseline, react, vue, svelte, solid, angular]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm e2e --project ${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: conformance/test-results
          retention-days: 7

      # The golden screenshots are made by React, here, in Playwright's image: a run without them
      # writes them (and fails). Download this artifact and commit it (conformance/README.md).
      - uses: actions/upload-artifact@v4
        if: always() && matrix.project == 'react'
        with:
          name: conformance-snapshots
          path: conformance/snapshots
          if-no-files-found: ignore
          retention-days: 7
